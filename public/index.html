<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodie — boshqaruv paneli</title>
<base target="_blank">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --surface-2: #f7f7fb; --border: #e3e4ec;
    --text: #1b1c24; --muted: #6b6e80; --accent: #5b5bd6; --accent-soft: #ecebfd;
    --ok: #1f9d63; --warn: #c27c0e; --bad: #d1435b;
    --bubble-user: #ffffff; --bubble-bot: #5b5bd6; --bubble-bot-text: #fff;
    --shadow: 0 1px 2px rgba(20,20,40,.05), 0 4px 16px rgba(20,20,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111218; --surface: #1a1b23; --surface-2: #20212b; --border: #2c2e3a;
      --text: #e9e9f1; --muted: #9a9cb0; --accent: #8b8bf5; --accent-soft: #2a2a4a;
      --bubble-user: #262733; --bubble-bot: #4b4bc4; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, textarea, input { font: inherit; color: inherit; }

  header { display: flex; align-items: center; gap: 14px; padding: 14px 24px;
    background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .logo { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(140deg, #7a6ff0, #5b5bd6 55%, #3f8fd8); color: #fff; font-weight: 800; font-size: 20px; }
  header h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;
    padding: 6px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .card > h2 { margin: 0; padding: 14px 18px 0; font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pad { padding: 14px 18px 18px; }

  .alert { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; border: 1px solid; }
  .alert.bad { background: color-mix(in srgb, var(--bad) 9%, transparent); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
  .alert.warn { background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .alert a { color: inherit; font-weight: 600; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-weight: 500; }
  dd a { color: var(--accent); text-decoration: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat { background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }

  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; cursor: pointer; }
  .switch input { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--border); position: relative; cursor: pointer; transition: background .2s; flex: none; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input:checked { background: var(--ok); } .switch input:checked::after { transform: translateX(18px); }
  label.lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  textarea { width: 100%; min-height: 190px; resize: vertical; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); line-height: 1.45; font-size: 14px; }
  textarea:focus, .composer input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 9px; cursor: pointer; font-weight: 550; font-size: 14px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .55; cursor: default; }
  .saved { font-size: 13px; color: var(--ok); opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }

  .chats { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 122px); min-height: 520px; overflow: hidden; }
  .list { border-right: 1px solid var(--border); overflow-y: auto; }
  .list h2 { position: sticky; top: 0; background: var(--surface); padding: 14px 16px 10px; margin: 0; font-size: 13px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .chat-item { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .chat-item:hover { background: var(--surface-2); }
  .chat-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
  .av { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
  .chat-item .meta { min-width: 0; flex: 1; }
  .chat-item .t { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; font-size: 14px; }
  .chat-item .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item time { font-size: 12px; color: var(--muted); font-weight: 400; flex: none; }
  .chat-item .p { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-list { padding: 18px 16px; color: var(--muted); font-size: 14px; }

  .conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .conv-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .conv-head .name { font-weight: 650; } .conv-head .sub { font-size: 12.5px; color: var(--muted); }
  .conv-head .btn { margin-left: auto; padding: 6px 11px; font-size: 13px; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
  .msg { max-width: min(640px, 82%); padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border: 1px solid var(--border); border-bottom-right-radius: 5px; }
  .msg.assistant { align-self: flex-start; background: var(--bubble-bot); color: var(--bubble-bot-text); border-bottom-left-radius: 5px; }
  .msg .from { display: block; font-size: 12px; font-weight: 650; color: var(--accent); margin-bottom: 2px; }
  .msg time { display: block; font-size: 11px; opacity: .6; text-align: right; margin-top: 3px; }
  .msg pre { background: rgba(0,0,0,.22); padding: 8px 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .msg code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .msg :not(pre) > code { background: rgba(127,127,127,.2); padding: 1px 4px; border-radius: 4px; }
  .msg.assistant a { color: #fff; }
  .note { align-self: center; font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 4px 12px; border-radius: 8px; max-width: 90%; text-align: center; }
  .note.error { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; background: var(--bubble-bot); border-radius: 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .5; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: 1; } }
  .placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 340px; font-size: 14px; }
  .composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
  .composer input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
  .readonly { padding: 10px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); text-align: center; }

  @media (max-width: 1050px) {
    main { grid-template-columns: 1fr; }
    .chats { height: 640px; }
  }
  @media (max-width: 680px) {
    header { padding: 12px 16px; } header p { display: none; }
    main { padding: 16px; gap: 16px; }
    .chats { grid-template-columns: 1fr; height: auto; }
    .list { border-right: 0; border-bottom: 1px solid var(--border); max-height: 240px; }
    .conv { height: 560px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">D</div>
  <div>
    <h1>Dodie</h1>
    <p>Telegram AI yordamchi — boshqaruv paneli</p>
  </div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Ulanmoqda…</span></div>
</header>

<main>
  <div class="col">
    <section class="card">
      <h2>Holat</h2>
      <div class="pad">
        <div id="alerts"></div>
        <dl>
          <dt>Telegram bot</dt><dd id="botName">—</dd>
          <dt>AI provayder</dt><dd id="aiProvider">—</dd>
          <dt>Model</dt><dd id="aiModel">—</dd>
          <dt>Kimlar yoza oladi</dt><dd id="access">—</dd>
        </dl>
        <div class="stats">
          <div class="stat"><b id="stReplies">0</b><span>javob</span></div>
          <div class="stat"><b id="stChats">0</b><span>suhbat</span></div>
          <div class="stat"><b id="stTokens">0</b><span>token</span></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Sozlamalar</h2>
      <div class="pad">
        <label class="switch">
          <span><b>Bot yoqilgan</b><br><span class="hint" style="margin:0">O'chirilsa, Dodie javob bermaydi</span></span>
          <input type="checkbox" id="enabled">
        </label>
        <label class="lbl" for="persona">Dodie'ning xarakteri</label>
        <textarea id="persona" spellcheck="false"></textarea>
        <p class="hint">Bu AI uchun ko'rsatma: kim ekanligi, qanday ohangda gapirishi, nimalarga javob berishi.</p>
        <div class="row">
          <button class="btn primary" id="savePersona">Saqlash</button>
          <button class="btn" id="resetPersona">Standart</button>
          <span class="saved" id="savedMark">✓ Saqlandi</span>
        </div>
      </div>
    </section>
  </div>

  <section class="card chats">
    <div class="list">
      <h2>Suhbatlar</h2>
      <div id="chatList"></div>
    </div>
    <div class="conv">
      <div class="conv-head" id="convHead"></div>
      <div class="msgs" id="msgs"></div>
      <div id="convFoot"></div>
    </div>
  </section>
</main>

<script type="module">
import { toTelegramHtml, escapeHtml } from "/lib/format.js";

const $ = (id) => document.getElementById(id);
const PANEL = "panel";
let state = null;
let selected = PANEL;
let current = null;      // tanlangan chatning to'liq ma'lumoti
let waiting = false;     // sinov chatida javob kutilmoqda

const COLORS = ["#5b5bd6", "#e0607e", "#1f9d8a", "#d9822b", "#3f8fd8", "#8e5bd6", "#4a9d3f"];
const colorFor = (id) => COLORS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initial = (t) => (t || "?").trim().charAt(0).toUpperCase();
const fmtTime = (ts) => {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString("uz-UZ", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("uz-UZ", { day: "numeric", month: "short" });
};
const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : String(n);

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ---------- Holat ----------
const STATUS = {
  online: ["ok", "Onlayn"], starting: ["", "Ishga tushmoqda…"], offline: ["warn", "Ulanish yo'q"],
  no_token: ["bad", "Token yo'q"], no_webhook: ["warn", "Webhook ulanmagan"], bad_token: ["bad", "Token noto'g'ri"], conflict: ["warn", "Ikki nusxa ishlayapti"],
};

function renderStatus() {
  const { bot, ai, stats, access } = state;
  const [cls, label] = STATUS[bot.state] ?? ["", bot.state];
  $("statusDot").className = "dot " + cls;
  $("statusText").textContent = bot.username && bot.state === "online" ? `@${bot.username} · ${label}` : label;
  $("botName").innerHTML = bot.username
    ? `<a href="https://t.me/${escapeHtml(bot.username)}">@${escapeHtml(bot.username)}</a>` : "—";
  $("aiProvider").textContent = ai.provider;
  $("aiModel").textContent = ai.model;
  $("access").textContent = access === "restricted" ? "Faqat ruxsat berilganlar" : "Hamma";
  $("stReplies").textContent = fmtNum(stats.replies);
  $("stChats").textContent = fmtNum(stats.chats);
  $("stTokens").textContent = fmtNum(stats.promptTokens + stats.completionTokens);

  const alerts = [];
  if (bot.state === "no_webhook") alerts.push(["warn", `${escapeHtml(bot.error)}<div class="row"><button class="btn primary" id="hookBtn">Webhookni ulash</button></div>`]);
  else if (bot.error) alerts.push(["bad", escapeHtml(bot.error)]);
  if (state.mode === "vercel" && state.storage !== "redis") alerts.push(["warn", "Vercel'da xotira ulanmagan: suhbatlar saqlanmaydi. Vercel → Storage → <b>Upstash (Redis)</b> qo'shing va qayta deploy qiling."]);
  if (!ai.keySet) alerts.push(["warn", `.env faylida <b>AI_API_KEY</b> yo'q. Bepul kalitni <a href="${escapeHtml(ai.keyUrl)}">shu yerdan</a> oling, .env ga yozing va serverni qayta ishga tushiring.`]);
  else if (bot.lastError) alerts.push(["bad", "AI xatosi: " + linkify(bot.lastError.hint)]);
  $("alerts").innerHTML = alerts.map(([c, h]) => `<div class="alert ${c}">${h}</div>`).join("");
}
$("alerts").addEventListener("click", async (e) => {
  if (e.target.id !== "hookBtn") return;
  e.target.disabled = true;
  try { await api("/api/webhook", {}); await refresh(); } catch (err) { alert("Xato: " + err.message); e.target.disabled = false; }
});
const linkify = (s) => escapeHtml(s).replace(/https?:\/\/\S+/g, (u) => `<a href="${u}">${u}</a>`);

// ---------- Sozlamalar ----------
function renderSettings(force) {
  $("enabled").checked = state.settings.enabled;
  if (force || document.activeElement !== $("persona")) $("persona").value = state.settings.persona;
}
$("enabled").addEventListener("change", async (e) => {
  state.settings = await api("/api/settings", { enabled: e.target.checked });
});
$("savePersona").addEventListener("click", async () => {
  state.settings = await api("/api/settings", { persona: $("persona").value });
  renderSettings(true);
  $("savedMark").classList.add("show");
  setTimeout(() => $("savedMark").classList.remove("show"), 1800);
});
$("resetPersona").addEventListener("click", () => {
  if (confirm("Xarakter matnini standart holatga qaytaraylikmi?")) $("persona").value = state.defaultPersona;
});

// ---------- Suhbatlar ro'yxati ----------
function renderList() {
  const chats = state.chats.filter((c) => c.id !== PANEL);
  const panel = state.chats.find((c) => c.id === PANEL);
  const item = (c, title, preview, color, letter) => `
    <button class="chat-item ${selected === c ? "active" : ""}" data-id="${escapeHtml(c)}">
      <div class="av" style="background:${color}">${letter}</div>
      <div class="meta">
        <div class="t"><span>${escapeHtml(title)}</span><time>${fmtTime(state.chats.find((x) => x.id === c)?.updatedAt)}</time></div>
        <div class="p">${escapeHtml(preview.replace(/[*_`~]+/g, ""))}</div>
      </div>
    </button>`;
  let html = item(PANEL, "Sinov chati", panel?.last ? (panel.last.role === "assistant" ? "Dodie: " : "") + panel.last.text : "Dodie bilan shu yerda gaplashing", "linear-gradient(140deg,#7a6ff0,#3f8fd8)", "D");
  html += chats.length
    ? chats.map((c) => item(c.id, c.title, c.last ? (c.last.role === "assistant" ? "Dodie: " : "") + c.last.text : "", colorFor(c.id), escapeHtml(initial(c.title)))).join("")
    : `<div class="empty-list">Telegram'dan hali xabar kelmadi. Botga yozib ko'ring — suhbat shu yerda jonli ko'rinadi.</div>`;
  $("chatList").innerHTML = html;
}
$("chatList").addEventListener("click", (e) => {
  const btn = e.target.closest(".chat-item");
  if (btn) openChat(btn.dataset.id);
});

// ---------- Suhbat oynasi ----------
async function openChat(id) {
  selected = id;
  renderList();
  current = await api(`/api/chats/${encodeURIComponent(id)}`).catch(() => null);
  renderConv();
}

function msgHtml(m, isGroup) {
  if (m.role === "note") return `<div class="note ${m.error ? "error" : ""}">${linkify(m.text)}</div>`;
  const body = m.role === "assistant" ? toTelegramHtml(m.text) : escapeHtml(m.text);
  const from = m.role === "user" && isGroup && m.from ? `<span class="from">${escapeHtml(m.from)}</span>` : "";
  return `<div class="msg ${m.role}">${from}${body}<time>${fmtTime(m.at)}</time></div>`;
}

function renderConv() {
  const isPanel = selected === PANEL;
  const title = isPanel ? "Sinov chati" : current?.title ?? "Suhbat";
  const sub = isPanel ? "Telegram'siz tekshirish — javoblar xuddi botdagidek"
    : { private: "Shaxsiy chat", group: "Guruh", supergroup: "Guruh", channel: "Kanal" }[current?.type] ?? "";
  $("convHead").innerHTML = `
    <div class="av" style="background:${isPanel ? "linear-gradient(140deg,#7a6ff0,#3f8fd8)" : colorFor(selected)}">${isPanel ? "D" : escapeHtml(initial(title))}</div>
    <div><div class="name">${escapeHtml(title)}</div><div class="sub">${escapeHtml(sub)}</div></div>
    ${current ? `<button class="btn" id="resetCtx" title="Dodie oldingi xabarlarni unutadi">Suhbatni yangilash</button>` : ""}`;

  const isGroup = current?.type === "group" || current?.type === "supergroup";
  const msgs = current?.messages ?? [];
  $("msgs").innerHTML = msgs.length
    ? msgs.map((m) => msgHtml(m, isGroup)).join("") + (waiting && isPanel ? `<div class="typing"><i></i><i></i><i></i></div>` : "")
    : (waiting && isPanel ? `<div class="typing"><i></i><i></i><i></i></div>`
      : `<div class="placeholder">${isPanel ? "Dodie'ga birinchi xabaringizni yozing 👋" : "Xabarlar yo'q"}</div>`);
  $("msgs").scrollTop = $("msgs").scrollHeight;

  $("convFoot").innerHTML = isPanel
    ? `<form class="composer" id="composer"><input id="draft" placeholder="Xabar yozing…" autocomplete="off" maxlength="4000" ${waiting ? "disabled" : ""}><button class="btn primary" ${waiting ? "disabled" : ""}>Yuborish</button></form>`
    : `<div class="readonly">Telegram suhbatini faqat ko'rish mumkin</div>`;
  if (isPanel && !waiting) $("draft")?.focus({ preventScroll: true });
}

$("convFoot").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("draft").value.trim();
  if (!text || waiting) return;
  waiting = true;
  current ??= { id: PANEL, type: "panel", messages: [] };
  renderConv();
  try {
    await api("/api/test", { text });
  } catch (err) {
    alert("Xato: " + err.message);
  } finally {
    waiting = false;
    if (selected === PANEL) await openChat(PANEL);
  }
});

$("convHead").addEventListener("click", async (e) => {
  if (e.target.id !== "resetCtx") return;
  await api(`/api/chats/${encodeURIComponent(selected)}/reset`, {});
  await openChat(selected);
});

// ---------- Jonli yangilanishlar ----------
async function refresh() {
  try {
    state = await api("/api/state");
  } catch (err) {
    document.querySelector("main").innerHTML = `<div class="card pad" style="grid-column:1/-1"><div class="alert bad">${escapeHtml(err.message)}</div></div>`;
    throw err;
  }
  renderStatus();
  renderSettings();
  renderList();
}

function connectEvents() {
  const es = new EventSource("/api/events");
  es.addEventListener("message", (e) => {
    const { chatId, message, chat } = JSON.parse(e.data);
    const i = state.chats.findIndex((c) => c.id === chatId);
    if (i >= 0) state.chats.splice(i, 1);
    state.chats.unshift(chat);
    renderList();
    if (chatId === selected) {
      current ??= { ...chat, messages: [] };
      current.messages.push(message);
      renderConv();
    }
  });
  es.addEventListener("status", (e) => { state.bot = JSON.parse(e.data); renderStatus(); });
  es.addEventListener("stats", (e) => { state.stats = JSON.parse(e.data); renderStatus(); });
  es.addEventListener("settings", (e) => { state.settings = JSON.parse(e.data); renderSettings(); });
  es.onopen = () => refresh().catch(() => {});
}

await refresh();
await openChat(PANEL);
if (state.mode === "local") {
  connectEvents();
  setInterval(() => refresh().catch(() => {}), 15000);
} else {
  // Vercel'da jonli oqim yo'q — har 5 soniyada yangilaymiz
  setInterval(async () => {
    await refresh().catch(() => {});
    if (!waiting && document.activeElement?.id !== "draft") {
      const fresh = await api(`/api/chats/${encodeURIComponent(selected)}`).catch(() => null);
      if (fresh && fresh.messages.length !== current?.messages.length) { current = fresh; renderConv(); }
    }
  }, 5000);
}
</script>
</body>
</html>
